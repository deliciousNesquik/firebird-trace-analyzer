name: Docs

# Сборка и публикация Starlight-сайта (папка docs/) на GitHub Pages.
# Требует в настройках репозитория: Settings → Pages → Source = "GitHub Actions".
#
# Триггеры:
#   • пуш в master, если менялась папка docs/ (или сам workflow);
#   • ручной запуск (workflow_dispatch).

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Права, необходимые для деплоя в Pages из Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Один одновременный деплой; текущий не прерываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22          # Astro 7 требует Node >= 22.12
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # path — от корня репозитория (working-directory на этот шаг не влияет).
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
